# Internal gateway for the Coolify deployment.
# Coolify's proxy (Traefik) terminates TLS for every domain and forwards plain HTTP
# here; this file reproduces the routing of the previous VPS nginx setup.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the original scheme/client seen by Traefik.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream chatloora_api {
    server api:4000;
    keepalive 32;
}

upstream chatloora_web {
    server web:3000;
    keepalive 32;
}

# Shared proxy headers (repeated per location because nginx does not inherit
# proxy_set_header into blocks that define their own).

# Apex → www
server {
    listen 80;
    server_name chatloora.com;
    return 301 https://www.chatloora.com$request_uri;
}

# Primary app
server {
    listen 80;
    server_name www.chatloora.com;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location = /tiktok-redirect {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    location /t/ {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    # Socket.io (realtime inbox, WhatsApp QR)
    location /socket.io/ {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://chatloora_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Old domain: OAuth callbacks registered with TikTok/Meta/Google still use it,
# and live pixels store form/store links on it. Everything else → chatloora.com.
server {
    listen 80;
    server_name almutamayiziq.com www.almutamayiziq.com;
    client_max_body_size 50M;

    location ^~ /api/auth/tiktok {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    location ^~ /api/auth/meta {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    location ^~ /api/v1/integrations/google/callback {
        proxy_pass http://chatloora_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
    }

    location / {
        return 301 https://www.chatloora.com$request_uri;
    }
}

# Anything else (raw IP, unknown hosts)
server {
    listen 80 default_server;
    server_name _;

    # Container health check (docker/Coolify call it without a public Host header).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://www.chatloora.com$request_uri;
    }
}
