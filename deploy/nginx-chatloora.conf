# chatloora.com — reverse proxy for PM2 web (3000) + api (4000)
# Old domain almutamayiziq.com permanently redirects here.

upstream watsapp_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream watsapp_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Apex → www
server {
    listen 80;
    listen [::]:80;
    server_name chatloora.com;
    return 301 https://www.chatloora.com$request_uri;
}

# Primary app (HTTP — Certbot will add SSL / redirect)
server {
    listen 80;
    listen [::]:80;
    server_name www.chatloora.com;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://watsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /tiktok-redirect {
        proxy_pass http://watsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /t/ {
        proxy_pass http://watsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://watsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://watsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://watsapp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Legacy domain → new canonical host
server {
    listen 80;
    listen [::]:80;
    server_name almutamayiziq.com www.almutamayiziq.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.chatloora.com$request_uri;
    }
}

# Keep HTTPS legacy cert working as redirect until cert expires / renews
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name almutamayiziq.com www.almutamayiziq.com;

    ssl_certificate /etc/letsencrypt/live/almutamayiziq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almutamayiziq.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.chatloora.com$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 161.97.140.171 _;
    return 301 https://www.chatloora.com$request_uri;
}
